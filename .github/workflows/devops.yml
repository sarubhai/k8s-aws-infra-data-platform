name: DataPlatformDevOps
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read 
jobs:
  devops-automation:
    runs-on: ["aws-hosted-runner"]
    steps:
      - name: Checkout local repo
        uses: actions/checkout@v4
      - name: Configure AWS access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          disable-retry: "true"
      - name: Get STS Caller Identity
        run: aws sts get-caller-identity
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
      - name: Configure EKS Cluster
        # env:
          # KUBECONFIG: /root/.kube/config
        run: |
          aws eks update-kubeconfig --name ${{ secrets.AWS_DEV_EKS_CLUSTER }} --alias ${{ secrets.AWS_DEV_EKS_CLUSTER }} # --kubeconfig $KUBECONFIG
          
          kubectl config get-contexts # --kubeconfig $KUBECONFIG
          kubectl config current-context # --kubeconfig $KUBECONFIG      
          
          kubectl cluster-info --kubeconfig $KUBECONFIG
          kubectl get pods -A
      
      
